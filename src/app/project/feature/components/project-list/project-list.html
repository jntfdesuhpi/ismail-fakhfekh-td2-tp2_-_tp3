<main>
  <h1>TaskFlow — Projets</h1>

  @for (project of projects; track project.id) {
    <app-project-card
      [project]="project"
      (projectSelected)="onProjectSelected($event)"   <!-- (projectSelected)="..." listens for the message coming up (output). It uses ( ) because it’s an event, just like (click) -->
      <!-- $event is whatever the child emitted, here in this exp is the project -->
    />
  }
</main>
