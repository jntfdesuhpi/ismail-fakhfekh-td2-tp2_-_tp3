<main class="min-h-screen bg-slate-100 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-6xl">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">TaskFlow — Projets</h1>
      <p class="mt-2 text-slate-600">Gérez vos projets et suivez leurs tâches.</p>
    </header>

    <app-view-toggle [selectedView]="view()" (viewChange)="onViewChange($event)" />

    @if (view() === 'task') {
      <label for="project-search" class="mb-2 mt-8 block text-sm font-medium text-slate-700">
        Rechercher un projet
      </label>
      <input
        id="project-search"
        class="mb-8 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 sm:max-w-md"
        type="text"
        placeholder="Rechercher un projet..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
      />
    }


    @if (view() === 'task') {
      <section aria-label="Liste des projets" class="mt-6 grid grid-cols-1 items-stretch gap-6 md:grid-cols-2 xl:grid-cols-3">
        @for (project of filteredProjects(); track project.id) {
          <app-project-card
            [project]="project"
            [users]="users()"
            (projectSelected)="onProjectSelected($event)"
            (taskStatusChange)="onTaskStatusChange($event)"
          />
        } @empty {
          <div class="md:col-span-2 xl:col-span-3">
            <app-empty-state />
          </div>
        }
      </section>
    } @else {
      <app-user-list class="mt-6 block" [projects]="filteredProjects()" />
    }
  </div>
</main>
