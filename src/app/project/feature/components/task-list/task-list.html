<ul class="space-y-3">
  @for (task of tasks() | slice:0:3; track task.id) {
    <li>
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [users]="users()"
        (taskStatusChange)="onTaskStatusChange(task.id, $event)"
      />
    </li>
  } @empty {
    <li class="rounded-lg bg-slate-50 px-4 py-3 text-sm text-slate-500">Aucune tâche</li>
  }
</ul>
