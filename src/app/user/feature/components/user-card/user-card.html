<article class="flex h-full flex-col rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200 transition hover:shadow-md sm:p-6">
  <!-- Informations utilisateur et badge Actif / Inactif -->
  <header class="mb-4 flex items-start justify-between gap-3">
    <div>
      <h2 class="text-lg font-semibold text-slate-900">{{ user().name }}</h2>
      <p class="text-sm text-slate-500">{{ user().email }}</p>
      <span class="mt-1 inline-block rounded-md bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600">
        {{ user().role }}
      </span>
    </div>

    <span
      data-testid="status-badge"
      class="inline-flex shrink-0 items-center rounded-full px-2.5 py-0.5 text-xs font-semibold"
      [ngClass]="user().active
        ? 'bg-emerald-100 text-emerald-800 ring-1 ring-emerald-600/20'
        : 'bg-rose-100 text-rose-800 ring-1 ring-rose-600/20'"
    >
      {{ user().active ? 'Actif' : 'Inactif' }}
    </span>
  </header>

  <!-- Trois compteurs de tâches (À faire = En attente, En cours, Terminées) -->
  <div class="mb-4 grid grid-cols-3 gap-2 rounded-lg bg-slate-50 p-3 text-center">
    <div class="rounded-md bg-white p-2 shadow-xs">
      <span class="block text-xs font-medium text-slate-500">À faire</span>
      <span class="text-base font-bold text-amber-600">{{ pendingCount() }}</span>
    </div>
    <div class="rounded-md bg-white p-2 shadow-xs">
      <span class="block text-xs font-medium text-slate-500">En cours</span>
      <span class="text-base font-bold text-blue-600">{{ inProgressCount() }}</span>
    </div>
    <div class="rounded-md bg-white p-2 shadow-xs">
      <span class="block text-xs font-medium text-slate-500">Terminées</span>
      <span class="text-base font-bold text-emerald-600">{{ doneCount() }}</span>
    </div>
  </div>

  <!-- Tâches regroupées par projet via UserProjectGroup -->
  <div class="space-y-4">
    @for (group of userProjects(); track group.project.id) {
      <app-user-project-group
        [project]="group.project"
        [tasks]="group.tasks"
      />
    } @empty {
      <p class="border-t border-slate-200 pt-4 text-sm text-slate-500">
        Aucune tâche assignée
      </p>
    }
  </div>
</article>
