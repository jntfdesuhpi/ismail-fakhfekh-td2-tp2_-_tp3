<section aria-label="Gestion des utilisateurs" class="w-full">
  <!-- Recherche utilisateur -->
  <div class="mb-6">
    <label for="user-search" class="mb-2 block text-sm font-medium text-slate-700">
      Rechercher un utilisateur
    </label>
    <input
      id="user-search"
      class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 sm:max-w-md"
      type="text"
      placeholder="Rechercher par nom, rôle ou email..."
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
    />
  </div>

  <!-- Liste des utilisateurs -->
  <div class="grid grid-cols-1 items-stretch gap-6 md:grid-cols-2 xl:grid-cols-3">
    @for (user of filteredUsers(); track user.id) {
      <app-user-card [user]="user" [projects]="currentProjects()" />
    } @empty {
      <div class="md:col-span-2 xl:col-span-3">
        <app-empty-state />
      </div>
    }
  </div>
</section>
